name: CI

# No path filter: ci is the required check, and a required check skipped by on.paths stays Pending.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Not keyed on github.workflow: a reusable workflow called from here evaluates that to this
# workflow's name, and a shared group deadlocks.
concurrency:
  group: chart-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ct diffs against origin/main
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25

      # Hooks in .pre-commit-config.yaml; tools from mise.toml.
      - run: prek run -a --show-diff-on-failure

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # Settings live in ct.yaml. A changed chart without a version bump fails here.
      - run: ct lint --config ct.yaml

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25

      # The fixture pulls the library through file://, into a gitignored charts/. update, not build:
      # a local Chart.lock goes stale on every library bump.
      - run: helm dependency update tests/fixtures/policy-stack-test

      - run: untt --strict tests/fixtures/policy-stack-test

      # A test with no stored snapshot writes one and passes, so it must have been committed.
      - run: |
          if [[ -n $(git status --porcelain -- tests) ]]; then
            git status --porcelain -- tests
            echo "::error title=Snapshots::Run untt locally and commit tests/**/__snapshot__."
            exit 1
          fi

  # The chart source as it stands in this PR. PolicyStack's validate.yml packages it under each
  # element's pinned version, so consumers render it without a version bump.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-library
          path: charts/policy-library
          if-no-files-found: error

  # Renders every PolicyStack element against this chart. A rename or removal fails here; a
  # breaking (!) PR is red by design and merges through the ruleset bypass.
  consumers:
    name: consumers
    if: github.event_name == 'pull_request'
    needs: package
    permissions:
      contents: read
    uses: PolicyStack/policystack/.github/workflows/validate.yml@main
    with:
      library-artifact: policy-library

  # The one required check. A failed, cancelled or skipped job above turns it red, except
  # consumers, which push to main skips.
  ci:
    name: ci
    if: always()
    needs: [lint, unittest, package, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: consumers
          jobs: ${{ toJSON(needs) }}
