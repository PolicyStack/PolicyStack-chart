# Exercises chart 3.3.0: policies[].hubTemplateOptions. Layered over values.yaml.
# Passed through verbatim on the base Policy only; certs keeps rendering without it.
stack:
  policyStackTest:
    policies:
      - name: base
        enabled: true
        description: "Baseline policy"
        severity: medium
        remediationAction: enforce
        disabled: false
        hubTemplateOptions:
          serviceAccountName: policy-hub-reader

      - name: certs
        enabled: true
        severity: low
        disabled: false
