# Exercises chart 3.0.0: operatorPolicies is a map. Layered over values.yaml.
# Pins oadp without restating it (mid two-step bump: old and new CSV both allowed), and adds an
# operator with no upgradeApproval, which renders Automatic.
stack:
  policyStackTest:
    operatorPolicies:
      oadp:
        subscription:
          startingCSV: oadp-operator.v1.4.1
        versions:
          - oadp-operator.v1.4.1
          - oadp-operator.v1.4.2

      cert-manager:
        enabled: true
        policyRef: base
        namespace: cert-manager-operator
        subscription:
          channel: stable-v1
          name: openshift-cert-manager-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
